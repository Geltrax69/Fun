<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fun — Open-World City</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%237da05c'/%3E%3Crect x='3' y='6' width='10' height='7' fill='%23c96f4a'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #87ceeb; }
      #scene { display: block; width: 100vw; height: 100vh; }
      #stats {
        position: fixed; top: 10px; left: 10px; z-index: 10;
        font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #e8f4ff; background: rgba(10, 20, 30, 0.62);
        padding: 8px 10px; border-radius: 6px; pointer-events: none;
        white-space: pre; user-select: none;
      }
      #hint {
        position: fixed; bottom: 10px; left: 10px; z-index: 10;
        font: 12px/1.5 system-ui, sans-serif; color: #e8f4ff;
        background: rgba(10, 20, 30, 0.5); padding: 6px 10px; border-radius: 6px;
        pointer-events: none; user-select: none;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="stats">starting…</div>
    <div id="hint">WASD move · Shift run · Space jump · click for mouse look · scroll to zoom</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
